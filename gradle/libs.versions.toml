[versions]
agp = "9.5.1"
# The version the Rust side's android-activity 0.6 is written against (its README); upgrade them together.
gamesActivity = "4.4.0"
appcompat = "1.8.0"
junitVersion = "1.3.0"
testRunner = "1.7.0"
orchestrator = "1.6.1"

[libraries]
games-activity = { group = "androidx.games", name = "games-activity", version.ref = "gamesActivity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-orchestrator = { group = "androidx.test", name = "orchestrator", version.ref = "orchestrator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
